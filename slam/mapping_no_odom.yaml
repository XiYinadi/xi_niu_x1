slam_toolbox:
  ros__parameters:
    mode: mapping
    use_sim_time: false
    scan_topic: /scan
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    map_update_interval: 3.0
    resolution: 0.05
    minimum_travel_distance: 0.05
    minimum_travel_heading: 0.05
    min_laser_range: 0.2
    max_laser_range: 12.0
    transform_timeout: 0.3
    scan_queue_size: 1
    throttle_scans: 1
