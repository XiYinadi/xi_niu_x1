# 犀牛派 二维云台 串口输出参数
# 加载: python3 ~/gimbal_proc.py --params ~/gimbal_params.yaml
#
# ⚠️⚠️ 协议要点(出处:收端 STM32 `hardware/us2/usart2.c:69-114` + `main.c:328-342`):
#
#   1. **`0xAA` 是速度帧,不是位置帧。** 收端:steps/s = |value| * 80(钳 20000,
#      即 |value| >= 250 饱和),|value| <= 5 → 停车并释放电机。正数 = CW,负数 = CCW。
#      ⇒ **`(0,0)` = 速度 0 = 停**,**不是**「角度回中」。回中只有 `0xBB` 能做(本实现没做)。
#   2. **速度是锁存的,收端没有超时保护。** 「发完 dx=100 不发新帧,云台会一直转下去。」
#      ⇒ 要停就必须**显式发 (0,0)**;断链时**停发会变成失控**。见 gimbal_proc._step。
#   3. **收端没有加减速斜坡。** 「直接发 0 → 8000 是瞬间跳变,会丢步/堵转。」
#      ⇒ 斜坡必须由**发送侧**做 —— 见 gimbal_slew_per_s。
#   4. 建议帧率 20~50Hz;>50Hz 只是反复覆盖 target(收端主循环发脉冲时是阻塞的)。
#   5. 收端会往 TX **回吐 ASCII**(BOOT OK / dx=.. dy=.. / HOMING...[HOME_OK)。
#      我们只发不收(pin16 不接),所以不处理;但**别人若要监听,别把文本当数据包**。
#
# ⚠️ 下面这几项**本机无法验证**,证据等级写在每一项旁边。
#     别因为「文件里写了某个值」就当成定案 —— 看清它是哪一档证据。
#
#   1. serial_port   —— 证据等级 **高,2026-09-27 已上板实测定案**。
#                       实测: /dev/ttyHS1 存在、属主 system:system 666 ⇒ aidlux 能开,
#                       且 `gimbal_proc` 真的把它开了起来,`tcgetattr` 读回
#                       `8N1 raw baud=115200` 与写下去的意图**逐位相符**。
#                       ⚠️ 板上**同时存在** ttyHS0/1/2/3:HS0/HS2 是蓝牙,
#                          HS3 是**另一块排针**且为 root:root 600(aidlux **打不开**)。
#                          ⇒ 「选错节点 = 静默不动」这个形状**在本板不成立**(会响亮失败),
#                          但**别据此放松**:以 root 跑或权限放宽后它立刻回来。
#                       ⚠️⚠️ 还有一条**本文件管不着、而且至今没验过**的静默风险:
#                          「ttyHS1 就是排针 PIN_29/PIN_16 那一对」这个映射来自厂商文档
#                          (证据等级**中**),**从没在硬件上验过**。若映射错了,字节会从
#                          *另一块排针*出去 —— 现象是**完全静默**。定案靠回环(29↔16),
#                          见 gimbal_wiring.md 附 1。
#   2. invert_x/y    —— 证据等级 **无**。dx/dy 的**正方向**是两个独立的未知量,
#                       性质和 motor_params.yaml 的 servo_invert 完全一样
#                       ("别照着名字猜")。判法见 gimbal_wiring.md。
#   3. slew_per_s    —— 证据等级 **中**(照协议点 2 的建议值算出来的,未实车标定)。
#
# ⚠️ 本文件**不与 motor_params.yaml 重复任何键** —— 云台走串口,不碰 GPIO,
#    两套参数各自独立加载,改这里不会影响电机那条链路。

gimbal:
  ros__parameters:
    # ── 串口 ──
    serial_port: /dev/ttyHS1    # 2026-09-27 上板实测定案(开得起来、配置读回相符)。
                                # 40-pin 排针 PIN_29(TX) + PIN_30(GND)
    serial_baud: 115200         # 协议给定:115200 / 8-N-1 / 无流控

    # ── 指令 ──
    # dx/dy 的正方向。**两个独立键** —— 别拿一个去推另一个。
    # 真机上判:先都不翻,跑 `python3 ~/gimbal_proc.py --pulse 50 0 1`
    # (⚠️ 不是早先的 --single-frame,那个在速度语义下会让云台一直转),看云台往哪边动;
    # 想让它往另一边就把 gimbal_invert_x 置 true。dy 同理用 `--pulse 0 50 1`。
    gimbal_invert_x: false
    gimbal_invert_y: false

    # ── 斜坡(**必做项,不是调优项**)──
    # 变化速率,单位/秒。协议点 2 明写斜坡要在发送侧做,建议「每 20ms 不超过 ±5」
    # ⇒ 5 / 0.02 = **250**。
    #   0 → 满量程约 0.40s(100/250),50Hz 下就是 20 帧。
    # ⚠️ `0` = **关**(退回阶跃)。留着是为了 A/B 对照:关掉就能复现「推摇杆没反应」
    #    —— 协议说那种阶跃会「丢步/堵转」,而堵转的步进电机现场看就是不动。
    # ⚠️ 调高就是往堵转走。这是**安全参数**,不是响应速度参数。
    gimbal_slew_per_s: 250.0

    # ── 节拍 ──
    # 发送周期(秒)。0.02 = 50Hz,落在协议建议的 20~50Hz 内。
    #
    # ⚠️ 「绝对量还是增量」这个悬案**已定案**:是**速度量**(且锁存)。
    #    所以「定节拍连发」不只是可以,而是**协议要求的**(点 1:不发就会一直转;
    #    点 3:别超过 ~50Hz)。**不要**改成「只在指令变化时发」——
    #    那样摇杆不动时云台会保持上一个速度继续转。
    #    ⚠️ 网页那边仍按 16ms emit:那是**输入**节拍,与本进程的**发送**节拍是两回事,
    #       两者不需要相等(收端取的是最新值,多发只是被覆盖)。
    gimbal_cmd_period_s: 0.02

    # 超过这么久没收到网页的 UDP 包 ⇒ 把目标压成 **0(零速)**,并**持续发零速帧**。
    # ⚠️⚠️ 这里**不能**改成「停发」。2026-09-27 修掉的就是这个错:速度是**锁存的**、
    #    收端没有超时保护,停发 = 云台**按最后那个速度一直转到撞限位** ——
    #    与「断链保持不动」的本意正好相反。零速帧才是「停」;
    #    而且重复发能扛住单帧被丢/被误校验。
    # ⚠️ 这里**不做滞回** —— 别照抄 pwm_proc / motor_control.Deadman 的样子。
    #    那个滞回是为了挡住「duty 在阈值两侧反复开合」;这里抖一下只是目标在 0 和
    #    摇杆值之间切换,斜坡还在中间兜着,机构不会跟着抖。
    gimbal_deadman_ms: 500.0
